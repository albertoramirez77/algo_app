[pytest]
testpaths = tests
pythonpath =
    .
    engine
    data/fetch
    research/reproducibility
    failed_research/hedger_flow_null
    failed_research/test_curve
python_files = test_*.py
addopts = -q
filterwarnings =
    # NumPy 2.0 on Apple Accelerate raises spurious FPE flags from the threaded matmul
    # path on any array with more than ~1000 rows, including all-finite random data.
    # Verified independent of this project's data.
    ignore:.*encountered in matmul:RuntimeWarning
